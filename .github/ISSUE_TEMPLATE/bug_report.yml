name: Bug report
description: Report a reproducible problem in the homelab applications
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private IP addresses, internal paths, production data or personal information.

  - type: dropdown
    id: application
    attributes:
      label: Application
      options:
        - Centro Servidor
        - Centro Multimedia
        - Centro Desarrollo
        - Centro Backups
        - Shared infrastructure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem clearly.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private addresses, internal paths and production data.
          required: true
