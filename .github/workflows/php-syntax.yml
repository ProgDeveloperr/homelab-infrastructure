name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP, JavaScript and data validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PHP syntax
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            php:8.2-cli \
            sh -lc '
              COUNT=$(find apps -type f -name "*.php" | wc -l)

              echo "PHP files found: $COUNT"

              if [ "$COUNT" -eq 0 ]; then
                  echo "No PHP files were found."
                  exit 1
              fi

              find apps -type f -name "*.php" -print0 \
                | xargs -0 -r -n1 php -l
            '

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          COUNT=$(find apps -type f -name "*.js" | wc -l)

          echo "JavaScript files found: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
              docker run --rm \
                -v "$GITHUB_WORKSPACE:/workspace:ro" \
                -w /workspace \
                node:22-alpine \
                sh -lc '
                  find apps -type f -name "*.js" -print0 \
                    | xargs -0 -r -n1 node --check
                '
          fi

      - name: Validate JSON files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          files = sorted(Path(".").rglob("*.json"))

          for path in files:
              json.loads(path.read_text(encoding="utf-8"))

          print(f"JSON files validated: {len(files)}")
          PY

      - name: Validate shell syntax
        shell: bash
        run: |
          COUNT=$(find . -type f -name "*.sh" \
            -not -path "./.git/*" | wc -l)

          echo "Shell files found: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
              find . -type f -name "*.sh" \
                -not -path "./.git/*" \
                -print0 |
              xargs -0 -r -n1 bash -n
          fi
